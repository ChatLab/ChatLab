<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatLab Web AI SDK Spike</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">ChatLab Web WASM</p>
        <h1>AI SDK 浏览器可行性验证</h1>
        <p>Key 只保存在当前页面内存中，刷新后立即清空。</p>
      </header>

      <section class="panel config-grid" aria-label="模型配置">
        <label>
          Provider Adapter
          <select id="provider-kind">
            <option value="openai-compatible">OpenAI Compatible</option>
            <option value="deepseek">DeepSeek 官方 Provider</option>
          </select>
        </label>
        <label>
          Base URL
          <input id="base-url" type="url" value="https://api.deepseek.com" autocomplete="off" />
        </label>
        <label>
          Model
          <input id="model" value="deepseek-v4-flash" autocomplete="off" />
        </label>
        <label>
          临时 API Key
          <input id="api-key" type="password" autocomplete="off" spellcheck="false" />
        </label>
      </section>

      <section class="actions" aria-label="测试操作">
        <button id="stream-test" type="button">1. 测试流式</button>
        <button id="tool-test" type="button">2. 测试工具循环</button>
        <button id="abort-test" type="button">3. 测试中止</button>
        <button id="stop" type="button" class="secondary" disabled>停止当前请求</button>
      </section>

      <section class="result-grid" aria-live="polite">
        <article class="panel metric">
          <span>状态</span>
          <strong id="status" data-testid="status">等待测试</strong>
        </article>
        <article class="panel metric">
          <span>首个输出</span>
          <strong id="ttfb" data-testid="ttfb">—</strong>
        </article>
        <article class="panel metric">
          <span>工具调用</span>
          <strong id="tool-count" data-testid="tool-count">0</strong>
        </article>
        <article class="panel metric">
          <span>Token</span>
          <strong id="usage" data-testid="usage">—</strong>
        </article>
      </section>

      <section class="panel output-panel">
        <div class="output-heading">
          <h2>事件与输出</h2>
          <button id="clear" type="button" class="text-button">清空</button>
        </div>
        <pre id="output" data-testid="output"></pre>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
